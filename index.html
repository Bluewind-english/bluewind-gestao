<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="BW AI">
<meta name="application-name" content="BW AI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#01030a">
<title>BlueWind – Gestão de Dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Ubuntu:wght@300;500;700&family=Michroma&family=Oswald:wght@500;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02060f; --navy:#061428; --blue:#2f8cff; --cyan:#4fd8ff; --glow:#1e6fff;
  --txt:#d8e9ff; --mut:#7f9cc4; --ok:#35e09a; --warn:#ffc24d; --bad:#ff5c6c;
  --line:rgba(79,170,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Rajdhani',sans-serif;overflow-x:hidden}
body{min-height:100vh;background:#01030a}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 50px) 16px calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;align-items:center}

/* Header */
.bw-logo{position:relative;width:min(70vw,290px);aspect-ratio:980/582;filter:drop-shadow(0 0 10px rgba(60,140,255,.35))}.bw-helice{position:absolute;z-index:2;left:28.034%;top:-7.825%;width:48.163%;animation:spin 9s linear infinite}.bw-text{position:absolute;left:0;top:54.983%;width:100%}
.bw-hor{display:block;width:min(86vw,360px);height:auto;margin-top:6px}
.bw-con{display:block;width:min(86vw,360px);height:auto;margin-top:-4px}
.brand{position:relative;text-align:center;margin-top:4px;width:100%;display:flex;flex-direction:column;align-items:center}
.bw-glow{position:absolute;left:50%;top:44%;width:300px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(170,215,255,.55) 0%,rgba(80,150,255,.22) 40%,rgba(20,60,160,0) 72%);filter:blur(6px);pointer-events:none}
.bw-blades{position:relative;width:74px;height:74px;filter:drop-shadow(0 0 12px rgba(79,170,255,.7));animation:spin 30s linear infinite}
.bw-word{position:relative;font-family:'Ubuntu',sans-serif;font-weight:700;font-size:54px;line-height:1;letter-spacing:-1.5px;margin-top:2px;filter:drop-shadow(0 0 14px rgba(140,200,255,.55))}
.bw-word .b1{color:#ffffff}.bw-word .b2{color:#3b8cff}
.bw-tag{position:relative;font-family:'Ubuntu',sans-serif;font-weight:300;font-size:19px;color:#dfeaff;margin-top:2px}
.np{position:relative;margin-top:10px;font-family:'Michroma','Orbitron',sans-serif;font-size:27px;letter-spacing:2px;
  background:linear-gradient(180deg,#ffffff 0%,#dfe6ee 38%,#8d99a8 52%,#e9eef4 70%,#aeb8c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(120,200,255,.35))}
.np-wave{position:relative;width:230px;height:12px;margin-top:4px;filter:drop-shadow(0 0 6px #4fd8ff)}
.np-sub{position:relative;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:2.2px;color:#fff;margin-top:6px}
.every{margin-top:18px;font-family:'Oswald',sans-serif;font-weight:500;font-size:17px;letter-spacing:.5px;color:#fff;text-align:center;white-space:nowrap}
.every b{font-weight:600;color:#5fd3ff}
.every i{font-style:normal;color:#8fb8f0;margin:0 6px}

/* Week bar */
.week{width:100%;margin-top:18px;position:relative;padding:9px 6px;display:flex;justify-content:space-around;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.week::before,.week::after{content:'';position:absolute;left:50%;width:0;height:0;border:5px solid transparent;transform:translateX(-50%)}
.week::before{top:0;border-top-color:var(--cyan)} .week::after{bottom:0;border-bottom-color:var(--cyan)}
.week div{font-family:'Orbitron';font-size:10.5px;color:#9db6d8;letter-spacing:1px;padding:4px 2px}
.week div.on{color:var(--cyan);font-size:13px;text-shadow:0 0 10px var(--cyan)}

/* Widgets */
.widgets{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;align-items:center}
.clock{display:flex;flex-direction:column;align-items:center}
.clock .ring{position:relative;width:118px;height:118px}
.clock svg{position:absolute;inset:0}
.clock .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock .t b{font-family:'Orbitron';font-size:24px;font-weight:700;color:#fff}
.clock .t small{font-family:'Orbitron';font-size:10px;color:var(--mut);letter-spacing:2px;margin-top:2px}
.clock .d{font-family:'Orbitron';font-size:11px;margin-top:6px;color:#cfe3ff;letter-spacing:1px}
.stat{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(160deg,rgba(18,50,100,.35),rgba(5,15,35,.5));box-shadow:inset 0 0 20px rgba(47,140,255,.12)}
.stat .k{font-family:'Orbitron';font-size:9px;letter-spacing:2px;color:var(--mut)}
.stat .v{font-family:'Orbitron';font-size:19px;color:#fff}
.stat .v em{font-style:normal;font-size:11px;color:var(--mut)}
.pbar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--cyan));box-shadow:0 0 8px var(--cyan)}
.stat .al{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

/* Orbit */
.orbit{position:relative;width:min(94vw,390px);aspect-ratio:.9;margin-top:14px;margin-bottom:6px}
.orbit .hudcv{position:absolute;inset:0;width:100%;height:100%}
.spin{animation:spin 40s linear infinite;transform-origin:50% 50%}
.spinr{animation:spin 28s linear infinite reverse;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#0d2346,#040b1a 70%);border:1.5px solid rgba(79,170,255,.55);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 0 14px rgba(47,140,255,.35),inset 0 0 12px rgba(79,216,255,.18);transition:transform .2s, box-shadow .2s}
.node:active,.node:hover{transform:scale(1.1);box-shadow:0 0 22px rgba(79,216,255,.7),inset 0 0 14px rgba(79,216,255,.35)}
.node svg{width:25px;height:25px;stroke:var(--c,#7cc8ff);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--c,#7cc8ff))}
.node label{position:absolute;top:61px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Orbitron';font-size:8px;letter-spacing:1px;color:#a9c6ea;pointer-events:none}
.node .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px var(--bad)}
.pill{position:absolute;left:50%;transform:translateX(-50%);padding:6px 18px;border:1px solid rgba(79,216,255,.6);border-radius:8px;
  background:linear-gradient(180deg,rgba(14,42,84,.9),rgba(4,14,32,.9));font-family:'Orbitron';font-size:11px;letter-spacing:3px;color:#dff1ff;
  box-shadow:0 0 14px rgba(79,216,255,.35);cursor:pointer;white-space:nowrap}
.pill.top{top:-3%} .pill.bot{bottom:-9%}
.core{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
  background:radial-gradient(circle,rgba(1,5,14,.97) 0%,rgba(4,16,38,.92) 58%,rgba(8,30,70,.6) 70%,rgba(8,30,70,0) 71%);
  box-shadow:0 0 0 1.5px rgba(79,216,255,.7),0 0 26px 6px rgba(30,111,255,.55),inset 0 0 22px rgba(79,216,255,.4);
  display:flex;align-items:center;justify-content:center;transition:box-shadow .3s}
.core::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(79,216,255,.25);animation:pulse 3s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.core svg.blades{display:none;width:86%;height:86%;animation:spin 14s linear infinite;filter:drop-shadow(0 0 8px rgba(79,216,255,.9))}
.core.fast svg.blades{animation-duration:1.3s}
.demo{margin-top:14px;font-family:'Orbitron';font-size:8.5px;letter-spacing:2px;color:#5f7ea8;text-align:center}

/* Sheet */
.shade{position:fixed;inset:0;background:rgba(1,5,14,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.shade.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:460px;max-height:84vh;z-index:21;
  background:linear-gradient(180deg,#071a38,#030b1c);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px rgba(30,111,255,.35);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.open{transform:translate(-50%,0)}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid rgba(79,170,255,.18)}
.sh-head h3{flex:1;font-family:'Orbitron';font-size:15px;letter-spacing:3px;color:#e8f4ff}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:#cfe3ff;font-size:18px;cursor:pointer}
.sh-body{overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 26px)}
.card{border:1px solid rgba(79,170,255,.25);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:rgba(10,30,64,.45)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h4{font-family:'Orbitron';font-size:13px;letter-spacing:1px;color:#fff}
.card p{font-size:15px;color:#b9cfec;margin-top:4px}
.tag{font-family:'Orbitron';font-size:9px;letter-spacing:1px;padding:4px 8px;border-radius:6px;border:1px solid currentColor}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.card .pbar{margin-top:9px}
.day{font-family:'Orbitron';font-size:11px;letter-spacing:2px;color:var(--cyan);margin:14px 2px 8px}
.day.today::after{content:' • HOJE';color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{text-align:center;padding:12px 4px;border:1px solid rgba(79,170,255,.25);border-radius:12px;background:rgba(10,30,64,.45)}
.kpi b{display:block;font-family:'Orbitron';font-size:24px}
.kpi span{font-size:13px;color:var(--mut)}
.msg{display:flex;gap:10px;margin-bottom:12px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-size:12px;background:#0d2a55;border:1px solid var(--line);color:var(--cyan)}
.msg .b{flex:1;background:rgba(10,30,64,.5);border:1px solid rgba(79,170,255,.2);border-radius:4px 14px 14px 14px;padding:8px 12px}
.msg .b small{font-family:'Orbitron';font-size:9px;color:var(--mut);letter-spacing:1px}
.msg .b p{font-size:15px;margin-top:3px}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:8px}

/* Turbine */
.tb{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 20%,rgba(30,111,255,.35),transparent 60%),rgba(2,6,16,.985);
  opacity:0;pointer-events:none;transition:opacity .25s;padding:18px 14px 14px}
.tb.open{opacity:1;pointer-events:auto}
.tb-top{width:100%;max-width:460px;display:flex;align-items:center;gap:12px}
.tb-orb{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#0b2a5a,#030b1c 70%);
  box-shadow:0 0 0 1.5px rgba(79,216,255,.6),0 0 24px rgba(30,111,255,.7)}
.tb-orb svg{width:78%;height:78%;animation:spin 10s linear infinite}
.tb-orb.fast svg{animation-duration:1.2s}
.tb-title{flex:1}
.tb-title b{font-family:'Orbitron';font-size:18px;letter-spacing:4px;color:#fff}
.tb-title div{font-size:14px;color:var(--cyan);margin-top:2px}
.snd{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:#cfe3ff;cursor:pointer;font-size:16px}
.chat{flex:1;width:100%;max-width:460px;overflow-y:auto;padding:16px 2px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.35;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:linear-gradient(135deg,#1d5fd6,#1a49a8);border-bottom-right-radius:4px;color:#fff}
.bub.a{align-self:flex-start;background:rgba(10,32,70,.75);border:1px solid rgba(79,216,255,.3);border-bottom-left-radius:4px}
.chips{width:100%;max-width:460px;display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:20px;border:1px solid rgba(79,216,255,.45);background:rgba(10,32,70,.6);color:#cfe9ff;font-family:'Rajdhani';font-weight:600;font-size:14px;cursor:pointer}
.bar2{width:100%;max-width:460px;display:flex;gap:8px;align-items:center}
.bar2 input{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:rgba(6,20,44,.9);color:#fff;padding:0 18px;font-size:16px;font-family:'Rajdhani';outline:none}
.bar2 input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(79,216,255,.4)}
.rb{width:48px;height:48px;flex:none;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2f8cff,#1450c8);box-shadow:0 0 16px rgba(47,140,255,.6)}
.rb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.mic.live{background:linear-gradient(135deg,#ff5c6c,#c4243a);box-shadow:0 0 22px rgba(255,92,108,.8);animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;text-align:center;max-width:460px}

/* Voice mode */
.vm{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px 20px;
  background:radial-gradient(ellipse at 50% 45%,rgba(30,111,255,.45),#02060f 62%),#02060f;opacity:0;pointer-events:none;transition:opacity .3s}
.vm.open{opacity:1;pointer-events:auto}
.vm .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:5;width:44px;height:44px;font-size:20px;background:rgba(5,15,35,.7)}
.vm>*{position:relative;z-index:1}
.vm-core{width:100%;max-width:520px;height:min(92vw,400px)}
.vm>#vmCv{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.vm-orb{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:min(22vw,92px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(1,5,14,.97),rgba(4,16,38,.92) 70%);box-shadow:0 0 0 1.5px rgba(79,216,255,.7),0 0 30px 8px rgba(30,111,255,.55),inset 0 0 22px rgba(79,216,255,.4)}
.vm-orb svg{display:none;width:86%;height:86%;animation:spin 12s linear infinite;filter:drop-shadow(0 0 10px #4fd8ff)}
.vm.live .vm-orb svg{animation-duration:1.4s}

.vm-orb::before,.vm-orb::after{content:'';position:absolute;inset:-16px;border-radius:50%;border:1.5px solid rgba(79,216,255,.5);opacity:0}
.vm.live .vm-orb::before,.vm.talk .vm-orb::before{animation:pulse 1.6s ease-out infinite}
.vm.live .vm-orb::after,.vm.talk .vm-orb::after{animation:pulse 1.6s ease-out .8s infinite}
.wave{display:flex;gap:5px;align-items:center;height:56px}
.wave i{width:5px;height:8px;border-radius:3px;background:linear-gradient(#4fd8ff,#1e6fff);box-shadow:0 0 8px #4fd8ff;transition:height .1s}
.vm-st{font-family:'Orbitron';font-size:13px;letter-spacing:4px;color:var(--cyan);text-align:center}
.vm-you{display:none;font-size:19px;color:#fff;text-align:center;min-height:26px;max-width:420px}
.vm-ans{display:none;font-size:16px;max-height:30vh;overflow-y:auto;color:#cfe3ff;text-align:center;min-height:24px;max-width:420px;line-height:1.35}
.vm-btn{padding:12px 22px;border-radius:26px;border:1px solid rgba(79,216,255,.6);background:linear-gradient(180deg,rgba(14,42,84,.9),rgba(4,14,32,.9));
  color:#e8f6ff;font-family:'Orbitron';font-size:11px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 16px rgba(79,216,255,.35)}
.vbtn{width:48px;height:48px;flex:none;border-radius:50%;cursor:pointer;border:1px solid rgba(79,216,255,.6);background:rgba(10,32,70,.8);display:flex;align-items:center;justify-content:center}
.vbtn svg{width:24px;height:24px;stroke:#4fd8ff;fill:none;stroke-width:2;stroke-linecap:round}
.core,.vm-orb{background:transparent!important;box-shadow:none!important}
.core::after{display:none}
.flag{background:none;border:0;padding:2px;cursor:pointer;opacity:.45;border-radius:4px;transition:opacity .2s,box-shadow .2s;line-height:0}
.flag.on{opacity:1;box-shadow:0 0 0 1.5px #4fd8ff,0 0 10px rgba(79,216,255,.6)}

/* sem zoom e sem seleção de texto (padrão dos apps) */
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;font-size:16px}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
.tb{padding-top:calc(env(safe-area-inset-top,0px) + 18px)!important;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)!important}
.vm{padding-top:calc(env(safe-area-inset-top,0px) + 30px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.back-home{font-size:10px!important;padding:9px 18px!important;opacity:.85;border-color:rgba(127,156,196,.5)!important}
.orbit .core{left:0;top:0;width:100%;height:100%;aspect-ratio:auto;transform:none;border-radius:0}
.vm-core{height:min(104vw,440px)!important}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bladeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fdcff"/><stop offset=".45" stop-color="#3f8cff"/><stop offset="1" stop-color="#123f9e"/>
    </linearGradient>
    <symbol id="blades" viewBox="-100 -100 200 200">
      <g id="bl">
        <path d="M5,-19 C24,-40 26,-72 9,-98 C-3,-86 -18,-60 -16,-38 C-15,-27 -6,-20 5,-19 Z" fill="url(#bladeG)" stroke="#bfe6ff" stroke-width="1.2"/>
        <path d="M5,-22 C17,-44 19,-70 8,-92" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.4"/>
      </g>
      <use href="#bl" transform="rotate(120)"/>
      <use href="#bl" transform="rotate(240)"/>
      <circle r="7" fill="#0a2a5c" stroke="#7cc8ff" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<div class="app">

/* ---------- Stars (espaço sideral) ---------- */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,S=[],NB=[];
  function rs(){const d=Math.min(devicePixelRatio,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d;
    S=Array.from({length:Math.round(innerWidth*innerHeight/900)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),p:Math.random()*6.28,s:1+Math.random()*4}));
    NB=Array.from({length:5},()=>({x:Math.random()*W,y:Math.random()*H,r:(.3+Math.random()*.4)*Math.max(W,H),c:Math.random()<.55?'40,90,220':'90,60,200',a:.05+Math.random()*.06}))}
  rs();addEventListener('resize',rs);
  (function f(ts){ts=ts||0;const t=ts/1000,d=Math.min(devicePixelRatio,2);x.clearRect(0,0,W,H);
    for(const n of NB){const g=x.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);g.addColorStop(0,'rgba('+n.c+','+n.a+')');g.addColorStop(1,'rgba('+n.c+',0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
    for(const s of S){const tw=.5+.5*Math.sin(t*s.s+s.p),al=(.15+.85*tw)*(.3+s.z*.7),r=(s.z>.93?1.6:s.z>.7?1:.6)*d;
      x.fillStyle=s.z>.85?'rgba(255,255,255,'+al+')':'rgba(160,200,255,'+al+')';x.beginPath();x.arc(s.x,s.y,r,0,6.283);x.fill();
      if(s.z>.97&&tw>.8){x.strokeStyle='rgba(200,230,255,'+al*.6+')';x.lineWidth=.6*d;x.beginPath();x.moveTo(s.x-5*d,s.y);x.lineTo(s.x+5*d,s.y);x.moveTo(s.x,s.y-5*d);x.lineTo(s.x,s.y+5*d);x.stroke()}}
    requestAnimationFrame(f)})();
})();

let AC=null,sfxOn=true,booted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,dur,type,vol,delay){const a=ac();if(!a||!sfxOn)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain(),fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=4200;
  o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(fl);fl.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,f1,f2,vol,delay){const a=ac();if(!a||!sfxOn)return;const t=a.currentTime+(delay||0);
  const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const n=a.createBufferSource();n.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=6;
  fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+dur*.3);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(fl);fl.connect(g);g.connect(a.destination);n.start(t)}

  close(){noise(.28,2800,500,.1);tone(1000,350,.2,'sine',.05)},

function makeDeviceDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,cbP=()=>{},cbF=()=>{},cbS=()=>{},stopRes=null;
  return {
    start(){return new Promise((res,rej)=>{
      try{rec=new SR()}catch(e){rej({code:'unavailable'});return}
      rec.lang=LANG==='en'?'en-US':'pt-BR';rec.continuous=true;rec.interimResults=true;
      rec.onstart=()=>{cbS({state:'listening'});res()};
      rec.onresult=e=>{let part='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)cbF({text:r[0].transcript.trim()});else part+=r[0].transcript}
        if(part)cbP({text:part.trim()})};
      rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){rej({code:'not_granted'})}else{try{rec.stop()}catch(_){}}};
      rec.onend=()=>{cbS({state:'idle',reason:'stopped'});if(stopRes){stopRes();stopRes=null}};
      try{rec.start()}catch(e){rej({code:'unavailable'})}
    })},
    stop(){return new Promise(r=>{if(!rec){r();return}stopRes=r;try{rec.stop()}catch(e){r()}setTimeout(()=>{if(stopRes){stopRes();stopRes=null}},1500)})},
    onPartial(f){cbP=f},onFinal(f){cbF=f},onState(f){cbS=f}
  };
}
function makeDeviceTTS(){
  if(!('speechSynthesis' in window))return null;
  let cbS=()=>{};
  function pickVoice(lang){const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang));
    return vs.find(v=>/luciana|felipe|google|premium|enhanced|natural/i.test(v.name))||vs[0]||null}
  return {
    speak(t){return new Promise((res,rej)=>{try{
      const en=LANG==='en',u=new SpeechSynthesisUtterance(t);u.lang=en?'en-US':'pt-BR';u.rate=1;u.pitch=1;
      const v=pickVoice(en?'en':'pt-br');if(v)u.voice=v;
      u.onstart=()=>cbS({state:'speaking'});
      u.onerror=e=>{cbS({state:'idle',reason:'error'});rej({code:e.error||'error'})};
      let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(guard);cbS({state:'idle',reason:'completed'});res()};
      u.onend=fin;const guard=setTimeout(fin,3000+t.length*75);
      speechSynthesis.cancel();setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){fin()}},350)}catch(e){rej({code:'error'})}})},
    stop(){try{speechSynthesis.cancel()}catch(e){}},
    onState(f){cbS=f}
  };
}
function unlockDeviceVoice(){try{if(!window.claude&&'speechSynthesis' in window&&!window.__vUnlocked){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);window.__vUnlocked=true}}catch(e){}}
if(!window.claude){
  try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
  const dd=makeDeviceDictation();if(dd){dict=dd;hookDict();mic.style.display='flex';document.getElementById('hint').textContent=LANG==='en'?'Tap the mic and talk to Eolus, or type.':'Toque no microfone e fale com o Eolus, ou digite.'}
  const dt=makeDeviceTTS();if(dt){tts=dt;dt.onState(({state})=>{if(!vmOn)return;if(state==='speaking'){if(vmMode!=='talk')vmSet('talk',TX('RESPONDENDO'))}else if(state==='idle'){talkDone()}})}
}


/* ---------- bloqueia zoom (pinça e duplo toque) e menu de seleção ---------- */
(function(){
  const no=e=>e.preventDefault();
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,no,{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  let last=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault();last=n},{passive:false});
  document.addEventListener('dblclick',no,{passive:false});
  document.addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()});
  document.addEventListener('selectstart',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()});
  document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
})();

/* ---------- voltar: tecla Esc e botão/gesto de voltar do celular ---------- */
function closeTop(){if(vm.classList.contains('open')){closeVM();return true}if(tb.classList.contains('open')){SFX.close();tb.classList.remove('open');stopSpeak();return true}if(sheet.classList.contains('open')){closeSheet();return true}return false}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop()});
(function(){const push=()=>{try{history.pushState({ov:1},'')}catch(e){}};
  ['open'].forEach(()=>{});
  const obs=new MutationObserver(()=>{const any=vm.classList.contains('open')||tb.classList.contains('open')||sheet.classList.contains('open');if(any&&!(history.state&&history.state.ov))push()});
  [vm,tb,sheet].forEach(el=>obs.observe(el,{attributes:true,attributeFilter:['class']}));
  addEventListener('popstate',()=>{closeTop()});
})();
/* capabilities */
const hint=document.getElementById('hint');
hint.textContent='Toque nas sugestões ou digite. No celular, use o microfone do teclado para falar.';
if(window.claude&&claude.use){
  claude.use('sample').then(s=>{sample=s}).catch(()=>{});
  claude.use('tts').then(t=>{tts=t;if(t&&t.onState)t.onState(({state})=>{if(!vmOn)return;
    if(state==='speaking'){if(vmMode!=='talk')vmSet('talk',TX('RESPONDENDO'))}
    else if(state==='idle'){talkDone()}})}).catch(()=>{});
  claude.use('dictation').then(d=>{if(d){dict=d;hookDict();mic.style.display='flex';hint.textContent='Toque no microfone e fale com o Eolus, ou digite.'}}).catch(()=>{});
}
